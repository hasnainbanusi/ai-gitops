apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hasnainbanusi/ai-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
