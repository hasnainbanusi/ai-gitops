apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-client
  namespace: ai-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-client
  template:
    metadata:
      labels:
        app: ai-client
    spec:
      containers:
        - name: ai-client
          image: curlimages/curl:latest
          command:
            - sleep
            - "3600"
